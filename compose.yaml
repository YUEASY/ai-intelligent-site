name: ai-intelligent-site

x-app-environment: &app-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_site
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret-before-production}
  BOOTSTRAP_TENANT_ID: ${BOOTSTRAP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me}
  SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-development-shopify-client-id}
  SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-development-shopify-client-secret}
  SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI:-http://localhost:8000/api/v1/shopify/oauth/callback}
  SHOPIFY_TOKEN_ENCRYPTION_KEY: ${SHOPIFY_TOKEN_ENCRYPTION_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_site
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_site"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  backend:
    image: ai-intelligent-site-app:local
    build: .
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"

  worker:
    image: ai-intelligent-site-app:local
    build: .
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment: *app-environment
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "celery -A app.celery_app.celery_app inspect ping --timeout 5 | grep -q pong"
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  redis-data:
